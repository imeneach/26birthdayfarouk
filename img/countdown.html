<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     DESIGN TOKENS
     Black night, warm gold candlelight, blush frosting.
     ============================================================ */
  :root{
    --night-1: #000000;
    --night-2: #0a0a0a;
    --night-3: #161616;
    --gold: #f6c453;
    --gold-dim: #caa24a;
    --blush: #f3a6b2;
    --cream: #fff7ea;
    --ember: #ff6b5e;
    --mint: #7fe3c0;

    --display: 'Baloo 2', sans-serif;
    --body: 'Fredoka', sans-serif;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(ellipse at 50% -10%, var(--night-3), var(--night-1) 60%);
    color: var(--cream);
    font-family: var(--body);
    overflow: hidden;
  }

  #stage{
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }

  /* faint drifting stars, ambient only */
  .star{
    position:absolute; border-radius:50%;
    background: var(--cream);
    opacity: .55;
    animation: twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{ opacity:.15; }
    50%{ opacity:.75; }
  }

  /* ============================================================
     COUNTDOWN SCREEN
     ============================================================ */
  #countdown-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap: clamp(20px, 4vh, 40px);
    text-align:center;
    padding: 24px;
    transition: opacity .9s ease, filter .9s ease;
  }

  .eyebrow{
    font-family: var(--body);
    font-weight: 600;
    letter-spacing: .35em;
    text-transform: uppercase;
    font-size: clamp(11px, 1.4vw, 14px);
    color: var(--gold);
    opacity: .85;
  }

  .headline{
    font-family: var(--display);
    font-weight: 600;
    font-size: clamp(28px, 5.5vw, 56px);
    line-height: 1.15;
    max-width: 16ch;
    margin: 0;
  }
  .headline em{
    font-style: italic;
    font-weight: 400;
    color: var(--blush);
  }

  .countdown-grid{
    display:flex;
    gap: clamp(10px, 2.4vw, 28px);
  }

  .unit{
    display:flex; flex-direction:column; align-items:center;
    gap: 8px;
  }

  .unit-number{
    font-family: var(--display);
    font-variant-numeric: tabular-nums;
    font-weight: 600;
    font-size: clamp(34px, 7vw, 76px);
    line-height: 1;
    min-width: 1.6ch;
    color: var(--cream);
    background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    border: 1px solid rgba(246,196,83,.25);
    border-radius: 14px;
    padding: clamp(10px,1.6vw,20px) clamp(8px,1.6vw,18px);
    box-shadow: 0 0 30px rgba(246,196,83,.08) inset, 0 10px 30px rgba(0,0,0,.35);
  }

  .unit-label{
    font-size: clamp(10px, 1.1vw, 13px);
    letter-spacing: .25em;
    text-transform: uppercase;
    color: var(--gold-dim);
    font-weight: 600;
  }

  .countdown-sub{
    font-size: clamp(13px, 1.6vw, 16px);
    color: rgba(255,247,234,.6);
    max-width: 34ch;
  }

  /* ============================================================
     CELEBRATION SCREEN
     ============================================================ */
  #celebration-screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity: 0; pointer-events:none;
    transition: opacity 1s ease;
  }
  #celebration-screen.show{
    opacity: 1; pointer-events:auto;
  }

  #fireworks-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
  }

  .celebration-content{
    position:relative; z-index: 2;
    display:flex; flex-direction:column; align-items:center;
    gap: clamp(10px, 2.5vh, 22px);
    text-align:center;
  }

  .banner{
    font-family: var(--display);
    font-weight: 700;
    font-style: italic;
    font-size: clamp(30px, 6.5vw, 68px);
    background: linear-gradient(180deg, #fff, var(--blush) 120%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin: 0;
    filter: drop-shadow(0 4px 18px rgba(0,0,0,.35));
  }

  .banner-sub{
    font-size: clamp(13px, 1.7vw, 17px);
    letter-spacing: .1em;
    color: rgba(255,247,234,.7);
    margin-top: -8px;
  }

  /* ---- cake ---- */
  #cake-wrap{
    width: min(78vw, 420px);
    filter: drop-shadow(0 10px 14px rgba(0,0,0,.28));
  }

  .flame{
    transform-box: fill-box;
    transform-origin: center bottom;
    opacity: 0;
    transform: scale(.2);
    transition: opacity .25s ease, transform .35s cubic-bezier(.34,1.56,.64,1);
  }
  .candle.lit .flame{
    opacity: 1;
    transform: scale(1);
    animation: flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform: scale(1) rotate(0deg); }
    30%{ transform: scale(1.08,.94) rotate(-2deg); }
    60%{ transform: scale(.94,1.08) rotate(2deg); }
  }

  .replay-btn{
    margin-top: clamp(8px, 2vh, 16px);
    font-family: var(--body);
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--night-1);
    background: var(--gold);
    border: none;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
    opacity: .9;
    transition: transform .2s ease, opacity .2s ease;
  }
  .replay-btn:hover{ transform: translateY(-2px); opacity: 1; }
  .replay-btn:focus-visible{ outline: 2px solid var(--mint); outline-offset: 3px; }

  /* ---- mic / blow-out status ---- */
  .mic-status{
    font-size: clamp(12px, 1.5vw, 14px);
    letter-spacing: .04em;
    color: rgba(255,247,234,.65);
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .mic-status .dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--gold-dim);
    box-shadow: 0 0 0 0 rgba(246,196,83,.5);
  }
  .mic-status.listening .dot{
    background: var(--mint);
    animation: micPulse 1.2s ease-in-out infinite;
  }
  @keyframes micPulse{
    0%,100%{ box-shadow: 0 0 0 0 rgba(127,227,192,.5); }
    50%{ box-shadow: 0 0 0 6px rgba(127,227,192,0); }
  }

  .mic-meter{
    width: 46px; height: 6px;
    border-radius: 999px;
    background: rgba(255,247,234,.12);
    overflow: hidden;
    display: inline-block;
  }
  .mic-meter-fill{
    display: block;
    height: 100%;
    width: 0%;
    background: var(--mint);
    transition: width .06s linear, background-color .15s ease;
  }

  .candle{ transition: opacity .15s ease; }
  .candle.lit{ cursor: pointer; }

  .smoke-puff{
    pointer-events: none;
    animation: smokeRise 1.1s ease-out forwards;
  }
  @keyframes smokeRise{
    0%{ transform: translateY(0) scale(.5); opacity: .55; }
    100%{ transform: translateY(-26px) scale(1.6); opacity: 0; }
  }

  /* ---- preview control, for testing before the real date ---- */
  #preview-btn{
    position: fixed; bottom: 16px; right: 16px; z-index: 50;
    background: rgba(255,255,255,.08);
    color: rgba(255,247,234,.6);
    border: 1px solid rgba(255,247,234,.2);
    border-radius: 999px;
    font-family: var(--body);
    font-size: 11px;
    letter-spacing: .05em;
    padding: 8px 14px;
    cursor: pointer;
  }
  #preview-btn:hover{ color: var(--cream); border-color: rgba(255,247,234,.4); }

  @media (prefers-reduced-motion: reduce){
    .flame, .star{ animation: none !important; }
  }
</style>
</head>
<body>

<div id="stage">

  <!-- ============ COUNTDOWN SCREEN ============ -->
  <div id="countdown-screen">
    <span class="eyebrow">Save the date</span>
    <h1 class="headline">Something <em>golden</em><br>is on its way</h1>

    <div class="countdown-grid">
      <div class="unit"><span class="unit-number" id="cd-days">00</span><span class="unit-label">Days</span></div>
      <div class="unit"><span class="unit-number" id="cd-hours">00</span><span class="unit-label">Hours</span></div>
      <div class="unit"><span class="unit-number" id="cd-mins">00</span><span class="unit-label">Min</span></div>
      <div class="unit"><span class="unit-number" id="cd-secs">00</span><span class="unit-label">Sec</span></div>
    </div>

    <p class="countdown-sub" id="countdown-sub">Come back when the numbers run out — the candles are waiting.</p>
  </div>

  <!-- ============ CELEBRATION SCREEN ============ -->
  <div id="celebration-screen">
    <canvas id="fireworks-canvas"></canvas>

    <div class="celebration-content">
      <p class="banner-sub">The wait is over</p>
      <h1 class="banner">Happy Birthday</h1>

      <div id="cake-wrap">
        <svg id="cake-svg" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

      <p class="mic-status" id="mic-status"><span class="dot"></span><span id="mic-status-text">Blow into your mic to blow out the candles</span><span class="mic-meter" id="mic-meter"><span class="mic-meter-fill" id="mic-meter-fill"></span></span></p>

      <button class="replay-btn" id="replay-btn">Light the candles again</button>
    </div>
  </div>

</div>

<!--
  AUDIO — add your recorded "Happy Birthday" vocal here.
  Replace the src below with your file (e.g. an uploaded mp3/wav path or URL).
  It's set to play automatically once all 26 candles are lit.
-->
<audio id="bday-song" preload="auto">
  <!-- <source src="your-happy-birthday-vocal.mp3" type="audio/mpeg"> -->
</audio>

<button id="preview-btn" title="Skip the countdown to check the celebration works">Preview celebration →</button>

<script>
(function(){

  /* ============================================================
     1. SET THE BIRTHDAY DATE HERE
     ------------------------------------------------------------
     Format: new Date('YYYY-MM-DDTHH:MM:SS')  — uses the visitor's
     local timezone. Placeholder is 30 days from page load so the
     countdown has something to show until the real date is set.
     ============================================================ */
 const TARGET_DATE = new Date('2026-08-25T23:00:00');

const CANDLE_COUNT = 2;

  /* ---------------- ambient stars ---------------- */
  const stage = document.getElementById('stage');
  for(let i=0;i<50;i++){
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random()*2 + 1;
    s.style.width = size+'px';
    s.style.height = size+'px';
    s.style.left = Math.random()*100+'vw';
    s.style.top = Math.random()*100+'vh';
    s.style.animationDelay = (Math.random()*3.5)+'s';
    stage.appendChild(s);
  }

  /* ---------------- countdown ---------------- */
  const el = {
    days: document.getElementById('cd-days'),
    hours: document.getElementById('cd-hours'),
    mins: document.getElementById('cd-mins'),
    secs: document.getElementById('cd-secs'),
    sub: document.getElementById('countdown-sub'),
    countdownScreen: document.getElementById('countdown-screen'),
    celebrationScreen: document.getElementById('celebration-screen'),
  };

  function pad(n){ return String(n).padStart(2,'0'); }

  let finished = false;

  function tick(){
    if(finished) return;
    const now = new Date();
    const diff = TARGET_DATE - now;

    if(diff <= 0){
      finished = true;
      clearInterval(timer);
      revealCelebration();
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins = Math.floor((diff % 3600000) / 60000);
    const secs = Math.floor((diff % 60000) / 1000);

    el.days.textContent = pad(days);
    el.hours.textContent = pad(hours);
    el.mins.textContent = pad(mins);
    el.secs.textContent = pad(secs);
  }

  const timer = setInterval(tick, 1000);
  tick();

  /* ---------------- build the kawaii cake + 2 candles ---------------- */
  const svgNS = 'http://www.w3.org/2000/svg';
  const cakeSvg = document.getElementById('cake-svg');
  cakeSvg.setAttribute('viewBox','0 0 400 340');
  let clipCounter = 0;

  function buildCake(){
    cakeSvg.innerHTML = '';
    clipCounter = 0;

    const defs = document.createElementNS(svgNS,'defs');
    defs.innerHTML = `
      <radialGradient id="flameGrad" cx="50%" cy="70%" r="70%">
        <stop offset="0%" stop-color="#fff6d8"/>
        <stop offset="45%" stop-color="#f6c453"/>
        <stop offset="100%" stop-color="#ff6b5e"/>
      </radialGradient>
    `;
    cakeSvg.appendChild(defs);

    // ---- bottom tier (large, kawaii face) ----
    // bodyTop = where the straight-sided body starts (icing cap sits above this line)
    const bottom = { x: 55, w: 290, bodyTop: 222, bodyH: 82, r: 26, speckleH: 26, capRise: 24 };

    // plate shadow, right under the bottom tier
    const plate = document.createElementNS(svgNS,'ellipse');
    plate.setAttribute('cx','200'); plate.setAttribute('cy', bottom.bodyTop + bottom.bodyH + 6);
    plate.setAttribute('rx','148'); plate.setAttribute('ry','12');
    plate.setAttribute('fill','rgba(255,247,234,.15)');
    cakeSvg.appendChild(plate);

    drawTier({
      x: bottom.x, bodyTop: bottom.bodyTop, w: bottom.w, bodyH: bottom.bodyH, r: bottom.r,
      bandColor: '#fbe3cf',
      speckleColor: '#c76b52', speckleH: bottom.speckleH,
      icingColor: '#f6a9bb', icingEdge: '#eb7f9a',
      drips: 12, dripDepth: 25, capRise: bottom.capRise, collar: 1,
      face: true
    });

    // strawberries sitting right on the bottom tier's icing, in front of the top tier
    const berryY = bottom.bodyTop - 15;
    const berryXs = [80, 120, 168, 200, 240,280,320];
    berryXs.forEach((bx,i) => addStrawberry(bx, berryY + (i%2===0?0:9), 1.05));

    // ---- top tier (smaller, nestled into the bottom tier's icing) ----
    const topTier = { x: 120, w: 160, bodyH: 30, r: 14, capRise: 18 };
    topTier.bodyTop = bottom.bodyTop - 20 - topTier.bodyH; // deep enough to cover the frosting valley below

    // strawberries in front of the top tier too, layered after it below
    drawTier({
      x: topTier.x, bodyTop: topTier.bodyTop, w: topTier.w, bodyH: topTier.bodyH, r: topTier.r,
      bandColor: '#fff7ea',
      speckleColor: null, speckleH: 0,
      icingColor: '#f6a9bb', icingEdge: '#eb7f9a',
      drips: 5, dripDepth: 15, capRise: bottom.capRise, collar: 1,
      face: false
    });

    const berryXsTop = [140, 200, 260];
   berryXsTop.forEach((bx,i) => addStrawberry(bx, topTier.bodyTop - 12, 0.85));

    // candles (2), planted right into the peak of the top tier's icing
    const candleGroup = document.createElementNS(svgNS,'g');
    candleGroup.setAttribute('id','candles');
    cakeSvg.appendChild(candleGroup);

    const peakY = topTier.bodyTop - topTier.capRise; // top of the icing dome
    const positions = [160 + 22,170 + 12,180 - 22, 220 - 22, 220 + 22, 240 - 22, 220 + 22];
    positions.forEach((x,i) => addCandle(candleGroup, x, peakY + 1, i));
    
  }

  // one tier: rounded body (clipped, so layers can never overflow) + dripping icing cap
  function drawTier({x, bodyTop, w, bodyH, r, bandColor, speckleColor, speckleH, icingColor, icingEdge, drips, dripDepth, capRise, collar, face}){
    const g = document.createElementNS(svgNS,'g');
    const bodyBottom = bodyTop + bodyH;

    // clip everything for this tier's body to a rounded-BOTTOM-corners-only
    // shape. Top corners stay square: the frosting cap sits right above and
    // already defines the rounded silhouette there — rounding the body's top
    // corners too (independently) left a sliver where the two curves didn't
    // line up, exposing the background. A square top always meets the cap's
    // straight vertical sides with zero gap.
    const clipId = `tierClip${clipCounter++}`;
    const clip = document.createElementNS(svgNS,'clipPath');
    clip.setAttribute('id', clipId);
    const clipPath = document.createElementNS(svgNS,'path');
    const cbb = bodyTop + bodyH; // clip bottom
    const clipD = `M${x},${bodyTop} L${x+w},${bodyTop} L${x+w},${cbb-r} Q${x+w},${cbb} ${x+w-r},${cbb} L${x+r},${cbb} Q${x},${cbb} ${x},${cbb-r} Z`;
    clipPath.setAttribute('d', clipD);
    clip.appendChild(clipPath);
    g.appendChild(clip);

    const bodyGroup = document.createElementNS(svgNS,'g');
    bodyGroup.setAttribute('clip-path', `url(#${clipId})`);

    // the icing color fills the WHOLE body first — this is what makes the
    // frosting cap blend into the tier instead of stopping at a hard seam
    const icingFill = document.createElementNS(svgNS,'rect');
    icingFill.setAttribute('x', x); icingFill.setAttribute('y', bodyTop);
    icingFill.setAttribute('width', w); icingFill.setAttribute('height', bodyH);
    icingFill.setAttribute('fill', icingColor);
    bodyGroup.appendChild(icingFill);

    // cream sponge layer, inset a little from the top so a thin icing collar shows through
    const cream = document.createElementNS(svgNS,'rect');
    cream.setAttribute('x', x); cream.setAttribute('y', bodyTop + collar);
    cream.setAttribute('width', w); cream.setAttribute('height', bodyH - collar);
    cream.setAttribute('fill', bandColor);
    bodyGroup.appendChild(cream);

    // speckled crumb layer along the bottom, still within the same clip
    if(speckleColor){
      const spk = document.createElementNS(svgNS,'rect');
      spk.setAttribute('x', x); spk.setAttribute('y', bodyBottom - speckleH);
      spk.setAttribute('width', w); spk.setAttribute('height', speckleH);
      spk.setAttribute('fill', speckleColor);
      bodyGroup.appendChild(spk);

      for(let i=0;i<Math.floor(w/9);i++){
        const dot = document.createElementNS(svgNS,'circle');
        dot.setAttribute('cx', x + 8 + Math.random()*(w-16));
        dot.setAttribute('cy', bodyBottom - speckleH*0.5 + (Math.random()-0.5)*speckleH*0.6);
        dot.setAttribute('r', 1.6 + Math.random()*1.4);
        dot.setAttribute('fill', 'rgba(0,0,0,.18)');
        bodyGroup.appendChild(dot);
      }
    }

    g.appendChild(bodyGroup);

    // kawaii face, centered in the cream area above the speckle band
    if(face){
      const cx = x + w/2;
      const creamH = bodyH - collar - speckleH;
      const cy = bodyTop + collar + creamH/2 + 2;
      addFace(g, cx, cy);
    }

    // dripping icing cap — its flat bottom edge sits exactly on bodyTop, so it
    // always meets the clipped body with zero gap
    const capTop = bodyTop - capRise;
    const icing = document.createElementNS(svgNS,'path');
    let d = `M${x},${bodyTop} Q${x},${capTop} ${x+r},${capTop} L${x+w-r},${capTop} Q${x+w},${capTop} ${x+w},${bodyTop} `;
    const segW = w / drips;
    for(let i=drips;i>=1;i--){
      const dropX = x + segW*(i-0.5);
      const leftX = x + segW*i;
      const rightX = x + segW*(i-1);
      const depth = dripDepth * (0.8 + Math.random()*0.3);
      d += `C${leftX-6},${bodyTop} ${dropX+7},${bodyTop-2+depth} ${dropX},${bodyTop-2+depth} `;
      d += `C${dropX-7},${bodyTop-2+depth} ${rightX+6},${bodyTop} ${rightX},${bodyTop} `;
    }
    d += 'Z';
    icing.setAttribute('d', d);
    icing.setAttribute('fill', icingColor);
    g.appendChild(icing);

    // small shine on the icing ridge (subtle, no extra shape/seam)
    const domeShine = document.createElementNS(svgNS,'ellipse');
    domeShine.setAttribute('cx', x + w*0.32); domeShine.setAttribute('cy', capTop + 5);
    domeShine.setAttribute('rx', w*0.13); domeShine.setAttribute('ry', 3.2);
    domeShine.setAttribute('fill', '#ffffff'); domeShine.setAttribute('opacity','.4');
    g.appendChild(domeShine);

    cakeSvg.appendChild(g);
  }

  function addFace(parent, cx, cy){
    const eyeColor = '#5a3b3b';
    [-1,1].forEach(side => {
      const ex = cx + side*20;
      const eye = document.createElementNS(svgNS,'ellipse');
      eye.setAttribute('cx', ex); eye.setAttribute('cy', cy);
      eye.setAttribute('rx', 5); eye.setAttribute('ry', 6.5);
      eye.setAttribute('fill', eyeColor);
      parent.appendChild(eye);

      const shine = document.createElementNS(svgNS,'circle');
      shine.setAttribute('cx', ex+1.6); shine.setAttribute('cy', cy-2.4);
      shine.setAttribute('r', 1.6);
      shine.setAttribute('fill', '#fff');
      parent.appendChild(shine);

      const blush = document.createElementNS(svgNS,'ellipse');
      blush.setAttribute('cx', cx + side*34); blush.setAttribute('cy', cy+9);
      blush.setAttribute('rx', 8); blush.setAttribute('ry', 5);
      blush.setAttribute('fill', '#ff9fb0'); blush.setAttribute('opacity','.55');
      parent.appendChild(blush);
    });

    const smile = document.createElementNS(svgNS,'path');
    smile.setAttribute('d', `M${cx-8},${cy+10} Q${cx},${cy+16} ${cx+8},${cy+10}`);
    smile.setAttribute('stroke', eyeColor);
    smile.setAttribute('stroke-width', '2.4');
    smile.setAttribute('stroke-linecap','round');
    smile.setAttribute('fill','none');
    parent.appendChild(smile);
  }

  function addStrawberry(cx, cy, scale){
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('transform', `translate(${cx},${cy}) scale(${scale})`);

    const body = document.createElementNS(svgNS,'path');
    body.setAttribute('d','M0,-2 C10,-2 12,10 0,20 C-12,10 -10,-2 0,-2 Z');
    body.setAttribute('fill', '#eb4d5c');
    g.appendChild(body);

    const shine = document.createElementNS(svgNS,'ellipse');
    shine.setAttribute('cx','-3'); shine.setAttribute('cy','4');
    shine.setAttribute('rx','2.6'); shine.setAttribute('ry','4');
    shine.setAttribute('fill','#ff8a93'); shine.setAttribute('opacity','.7');
    g.appendChild(shine);

    for(let i=0;i<5;i++){
      const seed = document.createElementNS(svgNS,'ellipse');
      const sx = -6 + (i%3)*6;
      const sy = 2 + Math.floor(i/3)*7 + (i%2)*3;
      seed.setAttribute('cx', sx); seed.setAttribute('cy', sy);
      seed.setAttribute('rx','0.7'); seed.setAttribute('ry','1.1');
      seed.setAttribute('fill','#ffe89a');
      g.appendChild(seed);
    }

    const leaf = document.createElementNS(svgNS,'path');
    leaf.setAttribute('d','M-7,-2 Q0,-9 7,-2 Q0,-5 -7,-2 Z');
    leaf.setAttribute('fill','#4f9d5c');
    g.appendChild(leaf);

    cakeSvg.appendChild(g);
  }

  function addCandle(parent, x, y, index){
    const g = document.createElementNS(svgNS,'g');
    g.setAttribute('class','candle');
    g.setAttribute('data-index', index);

    // generous invisible hit area — the visible candle is only ~8 units wide,
    // far too thin to reliably tap on a phone screen, so we give it real room
    const hitArea = document.createElementNS(svgNS,'rect');
    hitArea.setAttribute('x', x-18); hitArea.setAttribute('y', y-70);
    hitArea.setAttribute('width', 36); hitArea.setAttribute('height', 76);
    hitArea.setAttribute('fill', 'transparent');
    g.appendChild(hitArea);

    // candy-cane striped body
    const stickH = 30;
    const body = document.createElementNS(svgNS,'rect');
    body.setAttribute('x', x-4); body.setAttribute('y', y-stickH);
    body.setAttribute('width', 8); body.setAttribute('height', stickH);
    body.setAttribute('rx', 2);
    body.setAttribute('fill', '#fff7ea');
    g.appendChild(body);

    const clipId = `candleClip${index}`;
    const clip = document.createElementNS(svgNS,'clipPath');
    clip.setAttribute('id', clipId);
    const clipRect = document.createElementNS(svgNS,'rect');
    clipRect.setAttribute('x', x-4); clipRect.setAttribute('y', y-stickH);
    clipRect.setAttribute('width', 8); clipRect.setAttribute('height', stickH);
    clipRect.setAttribute('rx', 2);
    clip.appendChild(clipRect);
    g.appendChild(clip);

    const stripeGroup = document.createElementNS(svgNS,'g');
    stripeGroup.setAttribute('clip-path', `url(#${clipId})`);
    for(let s=0; s<6; s++){
      const stripe = document.createElementNS(svgNS,'rect');
      stripe.setAttribute('x', x-6); stripe.setAttribute('y', y-stickH + s*9 - 4);
      stripe.setAttribute('width', 12); stripe.setAttribute('height', 5);
      stripe.setAttribute('fill', '#eb4d5c');
      stripe.setAttribute('transform', `rotate(35 ${x} ${y-stickH+s*9})`);
      stripeGroup.appendChild(stripe);
    }
    g.appendChild(stripeGroup);

    const wick = document.createElementNS(svgNS,'rect');
    wick.setAttribute('x', x-0.7); wick.setAttribute('y', y-stickH-5);
    wick.setAttribute('width', 1.4); wick.setAttribute('height', 6);
    wick.setAttribute('fill', '#3a2a1a');
    g.appendChild(wick);

    const flame = document.createElementNS(svgNS,'path');
    const fy = y - stickH - 5;
    flame.setAttribute('class','flame');
    flame.setAttribute('d', `M${x},${fy-16} C${x+6},${fy-9} ${x+5},${fy-3} ${x},${fy} C${x-5},${fy-3} ${x-6},${fy-9} ${x},${fy-16} Z`);
    flame.setAttribute('fill', 'url(#flameGrad)');
    g.appendChild(flame);

    // remember the flame tip in SVG coordinates, used to place the smoke puff when blown out
    g.dataset.smokeX = x;
    g.dataset.smokeY = fy - 14;

    parent.appendChild(g);
  }

  buildCake();

  /* ---------------- reveal + light candles + fireworks + song ---------------- */
  const audio = document.getElementById('bday-song');
  const replayBtn = document.getElementById('replay-btn');
  const previewBtn = document.getElementById('preview-btn');

  function revealCelebration(){
    el.countdownScreen.style.opacity = '0';
    el.countdownScreen.style.filter = 'blur(6px)';
    setTimeout(()=>{ el.countdownScreen.style.display = 'none'; }, 900);

    el.celebrationScreen.classList.add('show');
    startFireworks();
    lightCandles();
    startBlowDetection();
  }

  function lightCandles(){
    const candles = Array.from(document.querySelectorAll('.candle'));
    candles.forEach(c => c.classList.remove('lit'));

    candles.forEach((c, i) => {
      setTimeout(()=> c.classList.add('lit'), i * 160);
    });

    const totalDelay = candles.length * 160 + 400;
    setTimeout(()=>{
      if(audio.currentSrc || audio.querySelector('source')){
        audio.currentTime = 0;
        audio.play().catch(()=>{ /* autoplay may need a user gesture; the click that opened this page usually covers it */ });
      }
    }, totalDelay);
  }

  replayBtn.addEventListener('click', () => {
    audio.pause();
    audio.currentTime = 0;
    lightCandles();
    setMicStatus('listening', 'Blow into your mic to blow out the candles');
    startBlowDetection();
  });

  previewBtn.addEventListener('click', () => {
    finished = true;
    clearInterval(timer);
    revealCelebration();
    previewBtn.remove();
  });

  /* ---------------- blow out the candles (mic, with tap-to-blow fallback) ---------------- */
  const micStatusEl = document.getElementById('mic-status');
  const micStatusText = document.getElementById('mic-status-text');

  function setMicStatus(state, text){
    micStatusEl.classList.toggle('listening', state === 'listening');
    micStatusText.textContent = text;
  }

  function spawnSmoke(candleEl){
    const sx = parseFloat(candleEl.dataset.smokeX);
    const sy = parseFloat(candleEl.dataset.smokeY);
    if(Number.isNaN(sx) || Number.isNaN(sy)) return;

    const puff = document.createElementNS(svgNS, 'g');
    puff.setAttribute('class', 'smoke-puff');
    for(let i=0;i<3;i++){
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', sx + (i-1)*2.5);
      c.setAttribute('cy', sy - i*2);
      c.setAttribute('r', 2.6 - i*0.4);
      c.setAttribute('fill', '#cfc9d6');
      puff.appendChild(c);
    }
    cakeSvg.appendChild(puff);
    setTimeout(()=> puff.remove(), 1150);
  }

  function extinguish(candleEl){
    if(!candleEl.classList.contains('lit')) return;
    candleEl.classList.remove('lit');
    spawnSmoke(candleEl);

    if(!document.querySelector('.candle.lit')){
      audio.pause();
      stopBlowDetection();
      setMicStatus('', '🎉 All blown out — make a wish!');
    }
  }

  // tap/click a lit candle to blow it out by hand — always available,
  // regardless of whether the mic is on, works well as a mic fallback too
  cakeSvg.addEventListener('click', (e) => {
    const candle = e.target.closest('.candle');
    if(candle) extinguish(candle);
  });

  // ---- microphone-based blowing (simple: just listen and check the volume) ----
  let audioCtx = null, analyser = null, micStream = null, micData = null;
  let listening = false, micRAF = null;
  const BLOW_THRESHOLD = 45; // average mic volume, 0-255 scale — raise/lower this if needed
  const micMeterFill = document.getElementById('mic-meter-fill');

  function startBlowDetection(){
    if(micStream && audioCtx){
      listening = true;
      if(audioCtx.state === 'suspended') audioCtx.resume();
      monitorMic();
      return;
    }

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      setMicStatus('', 'Mic not supported on this browser — tap a candle instead');
      return;
    }

    navigator.mediaDevices.getUserMedia({
      audio: { autoGainControl: false, noiseSuppression: false, echoCancellation: false }
    }).then(stream => {
      micStream = stream;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      source.connect(analyser);
      micData = new Uint8Array(analyser.frequencyBinCount);

      listening = true;
      setMicStatus('listening', 'Blow into your mic to blow out the candles');
      monitorMic();
    }).catch(() => {
      setMicStatus('', 'Mic access denied — tap a candle to blow it out');
    });
  }

  function monitorMic(){
    if(!listening) return;

    analyser.getByteFrequencyData(micData);
    let sum = 0;
    for(let i=0;i<micData.length;i++) sum += micData[i];
    const level = sum / micData.length;

    micMeterFill.style.width = Math.min(100, Math.round(level*2)) + '%';

    if(level > BLOW_THRESHOLD){
      blowOutAll();
    }

    micRAF = requestAnimationFrame(monitorMic);
  }

  function stopBlowDetection(){
    listening = false;
    if(micRAF) cancelAnimationFrame(micRAF);
    if(micMeterFill) micMeterFill.style.width = '0%';
  }

  function blowOutAll(){
    const lit = Array.from(document.querySelectorAll('.candle.lit'));
    if(lit.length === 0) return;
    lit.forEach((c, i) => setTimeout(() => extinguish(c), i * 120));
  }

  /* ---------------- fireworks ---------------- */
  const canvas = document.getElementById('fireworks-canvas');
  const ctx = canvas.getContext('2d');
  let fwRunning = false;
  let particles = [];

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const fwColors = ['#f6c453','#ff6b5e','#f3a6b2','#7fe3c0','#fff7ea','#a3b8ff'];

  function launchBurst(){
    const x = Math.random() * canvas.width * 0.8 + canvas.width*0.1;
    const y = Math.random() * canvas.height * 0.45 + canvas.height*0.08;
    const color = fwColors[Math.floor(Math.random()*fwColors.length)];
    const count = 34 + Math.floor(Math.random()*18);

    for(let i=0;i<count;i++){
      const angle = (Math.PI*2) * (i/count) + Math.random()*0.2;
      const speed = 1.4 + Math.random()*2.6;
      particles.push({
        x, y,
        vx: Math.cos(angle)*speed,
        vy: Math.sin(angle)*speed,
        life: 1,
        decay: 0.011 + Math.random()*0.012,
        color,
        size: 1.6 + Math.random()*1.8
      });
    }
  }

  let lastBurst = 0;
  function fwLoop(t){
    if(!fwRunning) return;
    ctx.clearRect(0,0,canvas.width,canvas.height);

    if(t - lastBurst > 750 + Math.random()*650){
      launchBurst();
      lastBurst = t;
    }

    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02; // gravity
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);

    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    requestAnimationFrame(fwLoop);
  }

  function startFireworks(){
    if(fwRunning) return;
    fwRunning = true;
    launchBurst();
    requestAnimationFrame(fwLoop);
  }

})();
</script>

</body>
